<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>No Bullying – Conversas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;600;800&display=swap">
<style>
:root{--ink:#14233b;--paper:#f2f6fa;--card:#fff;--line:#d9e2ec;--muted:#566680;--teal:#0e8f8a;--sun:#f2b632;--coral:#d84f3b;--us:#3b6fd4;--onacc:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--ink:#e8eef6;--paper:#0f1a2b;--card:#16243a;--line:#26364f;--muted:#a2b2c8;--teal:#35c2bb;--us:#7ba3f2;--coral:#f08574;--onacc:#0f1a2b}}
:root[data-theme="dark"]{color-scheme:dark;--ink:#e8eef6;--paper:#0f1a2b;--card:#16243a;--line:#26364f;--muted:#a2b2c8;--teal:#35c2bb;--us:#7ba3f2;--coral:#f08574;--onacc:#0f1a2b}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:#14233b;color:#f2f6fa;padding:22px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.logo{font-weight:800;font-size:22px;line-height:1.1;margin-bottom:18px;display:flex;gap:10px;align-items:center}
.logo b{display:grid;place-items:center;width:38px;height:38px;border-radius:50% 50% 50% 8px;background:var(--sun);color:#14233b;font-size:20px}
.nav{background:none;border:0;text-align:left;padding:10px 12px;border-radius:10px;color:inherit;opacity:.8;font-weight:600}
.nav:hover{background:rgba(255,255,255,.1);opacity:1}.nav.on{background:var(--sun);color:#14233b;opacity:1}
.who{margin-top:auto;font-size:14px;opacity:.85;border-top:1px solid rgba(255,255,255,.2);padding-top:12px}
.who button{margin-top:8px;background:none;border:1px solid rgba(255,255,255,.4);color:inherit;border-radius:8px;padding:5px 10px}
main{padding:28px clamp(16px,3vw,40px);max-width:1180px;width:100%}
h1{font-size:clamp(28px,4vw,40px);line-height:1.1;margin:0 0 4px;font-weight:800}
h2{font-size:18px;margin:0 0 12px;font-weight:600}
.sub{color:var(--muted);margin:0 0 20px;max-width:60ch}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 14px;font-weight:600;font-size:14px}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.grid{display:grid;gap:14px}.k4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.k2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.kpi small{color:var(--muted);font-weight:600}.kpi strong{display:block;font-size:34px;line-height:1.15;font-weight:800}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:9px;background:var(--teal);transition:width .6s}
.ribbon{display:flex;height:64px;border-radius:14px;overflow:hidden;font-weight:800;font-size:24px;color:#fff}
.ribbon span{display:flex;align-items:center;padding:0 16px;min-width:0;white-space:nowrap;transition:flex-basis .6s}
.ribbon .s{background:#3b6fd4}.ribbon .w{background:#0e8f8a;justify-content:flex-end}
.leg{display:flex;flex-wrap:wrap;gap:10px 18px;margin-top:12px;font-size:14px}
.leg button{background:none;border:0;padding:2px 0;display:flex;gap:6px;align-items:center;font-weight:600}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block}
.donut{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.days{display:flex;gap:10px;align-items:flex-end;height:170px}
.day{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;font-size:13px;color:var(--muted)}
.stack{width:100%;max-width:46px;display:flex;flex-direction:column-reverse;border-radius:8px 8px 0 0;overflow:hidden;transition:height .6s}.stack i{display:block}
label{display:block;font-weight:600;margin:0 0 6px}
input[type=text],input[type=email],input[type=password],textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);margin-bottom:14px}
textarea{resize:vertical}
.btn{background:var(--teal);color:var(--onacc);border:0;border-radius:10px;padding:12px 20px;font-weight:800}.btn:hover{filter:brightness(1.08)}
.note{font-size:13px;color:var(--muted);border-left:4px solid var(--sun);padding:6px 12px;margin:16px 0}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:700;color:#fff}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);font-size:15px}
.empty{padding:26px;text-align:center;color:var(--muted)}
.chat{display:grid;gap:14px}.chat.two{grid-template-columns:270px 1fr}
.cv{display:block;width:100%;text-align:left;background:none;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;position:relative}
.cv.on{border-color:var(--teal);background:var(--paper)}.cv small{display:block;color:var(--muted)}
.cv .pill{position:absolute;right:10px;top:10px}
.thr{height:min(52vh,420px);overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-bottom:8px}
.msg{max-width:80%;align-self:flex-start}.msg span{font-size:12px;color:var(--muted)}
.msg p{margin:2px 0 0;padding:10px 14px;border-radius:16px 16px 16px 4px;background:var(--paper);border:1px solid var(--line);white-space:pre-wrap;word-break:break-word}
.msg.me{align-self:flex-end;text-align:right}.msg.me p{background:var(--teal);color:var(--onacc);border-color:var(--teal);border-radius:16px 16px 4px 16px;text-align:left}
.cmp{display:flex;gap:10px;align-items:flex-end;border-top:1px solid var(--line);padding-top:12px}.cmp textarea{margin:0}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.auth .card{width:min(460px,100%);padding:28px}
.err{color:var(--coral);font-weight:600;min-height:22px;margin:0 0 8px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);background:#14233b;color:#f2f6fa;padding:12px 18px;border-radius:12px;opacity:0;transition:.3s;pointer-events:none;z-index:9}#toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:760px){.app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px}.logo{margin:0 auto 0 0;font-size:18px}.who{margin:0;border:0;padding:0;width:100%;display:flex;gap:10px;align-items:center}.who button{margin:0}.chat.two{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="root"></div><div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./no-bullying-v2.js"></script>
</body>
</html>
